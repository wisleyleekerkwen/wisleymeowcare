<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wisley Meowcare">
<meta name="theme-color" content="#FBF6EE">
<title>Wisley Meowcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#FBF6EE;
    --card:#FFFFFF;
    --card-alt:#F4ECDF;
    --ink:#3E362C;
    --ink-light:#9C8F7E;
    --sage:#8CA891;
    --sage-dark:#6C8B72;
    --peach:#F3A57E;
    --peach-dark:#E68A57;
    --honey:#E7B04E;
    --rose:#E6A0A6;
    --danger:#D97066;
    --line:#EDE2D0;
    --radius:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden;}
  body{font-family:'Nunito',sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center;}
  #shell{
    width:100%; max-width:460px; min-height:100vh; background:var(--bg); position:relative; padding-bottom:92px; overflow-x:hidden;
    background-image:
      radial-gradient(circle at 92% 4%, rgba(140,168,145,0.10) 0, transparent 40%),
      radial-gradient(circle at 6% 14%, rgba(243,165,126,0.10) 0, transparent 35%);
  }
  h1,h2,h3,.brand,.tabbtn span.label{font-family:'Fredoka',sans-serif;}
  h1{font-size:26px;margin:0 0 2px;}
  h2{font-size:19px;margin:0 0 10px;}
  h3{font-size:15px;margin:0 0 6px;color:var(--ink);}
  #topbar{padding:22px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:20px;color:var(--sage-dark);}
  .brand .pawmark{width:30px;height:30px;flex:none;}
  .headerbtn{background:var(--card); border:1px solid var(--line); color:var(--sage-dark); width:38px;height:38px;border-radius:14px; display:flex;align-items:center;justify-content:center; font-size:18px; cursor:pointer;}
  #screen{padding:0 16px 20px;}
  .card{background:var(--card); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:0 2px 14px rgba(80,60,30,0.05); border:1px solid var(--line);}
  .card.tap{cursor:pointer; transition:transform .12s ease;}
  .card.tap:active{transform:scale(0.98);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--ink-light); font-size:13px;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:99px; font-size:12px; font-weight:800; background:var(--card-alt); color:var(--sage-dark);}
  .pill.orange{background:#FCEBDD;color:var(--peach-dark);}
  .pill.green{background:#E5F0E4;color:var(--sage-dark);}
  .pill.red{background:#FBE4E1;color:var(--danger);}
  .pill.gray{background:#F1ECE3;color:var(--ink-light);}
  .btn{border:none; border-radius:16px; padding:12px 16px; font-weight:800; font-size:14.5px; cursor:pointer; font-family:'Nunito',sans-serif; display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn-primary{background:var(--sage); color:#fff;}
  .btn-primary:active{background:var(--sage-dark);}
  .btn-peach{background:var(--peach); color:#fff;}
  .btn-peach:active{background:var(--peach-dark);}
  .btn-soft{background:var(--card-alt); color:var(--ink);}
  .btn-outline{background:transparent;border:1.5px solid var(--sage);color:var(--sage-dark);}
  .btn-danger{background:#FBE4E1;color:var(--danger);}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:12px;}
  .btn-block{width:100%;}
  .fab{position:absolute; right:18px; bottom:110px; width:56px;height:56px;border-radius:20px; background:var(--peach); color:#fff; display:flex;align-items:center;justify-content:center;font-size:26px; border:none; box-shadow:0 8px 18px rgba(230,138,87,0.4); cursor:pointer; z-index:40;}
  #bottomnav{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;}
  #navwrap{width:100%; max-width:460px; background:rgba(255,255,255,0.92); backdrop-filter:blur(6px); border-top:1px solid var(--line); display:flex; padding:8px 6px 14px;}
  .tabbtn{flex:1; background:none;border:none; display:flex;flex-direction:column;align-items:center;gap:3px; padding:6px 2px; color:var(--ink-light); cursor:pointer;}
  .tabbtn.active{color:var(--sage-dark);}
  .tabbtn .ic{font-size:20px;}
  .tabbtn span.label{font-size:11px;font-weight:600;}
  input,select,textarea{width:100%; font-family:'Nunito',sans-serif; font-size:14.5px; color:var(--ink); background:var(--card-alt); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:12px; outline:none;}
  textarea{resize:vertical; min-height:56px;}
  label.flabel{font-size:12.5px; font-weight:800; color:var(--ink-light); margin:0 0 5px 2px; display:block;}
  .divider{height:1px;background:var(--line); margin:14px 0;}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-light);}
  .empty .emoji{font-size:44px; display:block; margin-bottom:10px;}
  .avatar{width:44px;height:44px;border-radius:14px; display:flex;align-items:center;justify-content:center; color:#fff; font-weight:800; font-size:15px; flex:none;}
  .searchbar{position:relative;}
  .searchbar input{padding-left:36px;}
  .searchbar .sic{position:absolute; left:12px; top:11px; opacity:0.5;}
  #modalRoot{position:fixed; inset:0; z-index:100; display:none;}
  #modalRoot.open{display:flex; align-items:flex-end; justify-content:center;}
  #modalOverlay{position:absolute; inset:0; background:rgba(50,40,25,0.38);}
  #modalCard{position:relative; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; background:var(--bg); border-radius:26px 26px 0 0; padding:18px 18px 26px; animation:slideup .18s ease-out;}
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0);opacity:1;}}
  .modalhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .closex{width:32px;height:32px;border-radius:12px;background:var(--card-alt); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink-light); font-size:16px;}
  table.simple{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.simple th{text-align:left; color:var(--ink-light); font-size:11.5px; padding:4px 6px; font-weight:800;}
  table.simple td{padding:8px 6px; border-top:1px solid var(--line);}
  .miniremove{background:#FBE4E1;color:var(--danger); border:none; width:30px;height:30px;border-radius:10px;flex:none;cursor:pointer;font-size:15px;}
  .totalline{display:flex; justify-content:space-between; padding:5px 0; font-size:14px;}
  .totalline.big{font-weight:800; font-size:17px; padding-top:8px; border-top:1px dashed var(--line); margin-top:6px;}
  .subnav{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .subnav::-webkit-scrollbar{display:none;}
  .subchip{flex:none; padding:8px 14px; border-radius:99px; background:var(--card); border:1px solid var(--line); font-weight:800; font-size:13px; color:var(--ink-light); cursor:pointer; white-space:nowrap;}
  .subchip.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .statcard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px;}
  .statcard .v{font-size:20px; font-weight:800; font-family:'Fredoka',sans-serif;}
  .statcard .l{font-size:12px; color:var(--ink-light); margin-top:2px;}
  .paw-divider{display:flex; justify-content:center; gap:10px; opacity:0.35; margin:6px 0 14px; font-size:13px;}
  .photobox{width:100%; aspect-ratio:4/3; border-radius:16px; background:var(--card-alt); display:flex;align-items:center;justify-content:center; overflow:hidden; margin-bottom:10px; cursor:pointer; border:1px dashed #cbb99a;}
  .photobox img{width:100%;height:100%;object-fit:cover;}
  .checkline{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:700; font-size:14px;}
  .checkline input{width:auto; margin:0;}
  .toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:700; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--sage-dark);font-weight:800;cursor:pointer;font-size:14px;}
  .cal-grid{display:flex; flex-wrap:wrap; width:100%; text-align:center;}
  .cal-dow{width:14.2857%; box-sizing:border-box; font-size:11px; color:var(--ink-light); font-weight:800; padding-bottom:6px;}
  .cal-cell{width:14.2857%; box-sizing:border-box; aspect-ratio:1; margin-bottom:4px; display:flex;align-items:center;justify-content:center; border-radius:12px; font-size:13.5px; cursor:pointer; position:relative; font-weight:700; color:var(--ink);}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border:1.5px solid var(--sage);}
  .cal-cell.selected{background:var(--sage); color:#fff;}
  .cal-cell .dot{position:absolute; bottom:4px; width:5px;height:5px;border-radius:50%;background:var(--peach);}
  .cal-cell.selected .dot{background:#fff;}
  .visitrow{background:var(--card-alt); border-radius:16px; padding:12px; margin-bottom:10px;}
  .visitrow .vtop{display:flex; gap:8px; margin-bottom:8px;}
  .visitrow input, .visitrow textarea{margin-bottom:0;}
  .qaitem{margin-bottom:10px;}
  .qaitem .q{font-size:12.5px; font-weight:800; color:var(--sage-dark); margin-bottom:4px;}
  .qrmini{display:flex; align-items:center; gap:10px; background:var(--card-alt); border-radius:14px; padding:8px 10px; margin-bottom:8px;}
  .qrmini img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff;}
</style>
</head>
<body>
<div id="shell">
  <div id="topbar">
    <div class="brand"><img class="pawmark" id="logoImg" src="" style="width:34px;height:34px;border-radius:10px;object-fit:cover;"><span id="brandName">Wisley Meowcare</span></div>
    <button class="headerbtn" id="langBtn" onclick="toggleLang()" style="font-weight:800; font-size:13px;">EN</button>
    <button class="headerbtn" onclick="openSettings()">⚙️</button>
  </div>
  <div id="screen"></div>
  <button class="fab" id="fabBtn" onclick="onFab()">＋</button>
  <div id="bottomnav"><div id="navwrap">
    <button class="tabbtn" data-tab="today" onclick="setTab('today')"><span class="ic">🏠</span><span class="label" id="navlbl_today">今天</span></button>
    <button class="tabbtn" data-tab="clients" onclick="setTab('clients')"><span class="ic">🐾</span><span class="label" id="navlbl_clients">客户</span></button>
    <button class="tabbtn" data-tab="schedule" onclick="setTab('schedule')"><span class="ic">📅</span><span class="label" id="navlbl_schedule">日程</span></button>
    <button class="tabbtn" data-tab="money" onclick="setTab('money')"><span class="ic">💰</span><span class="label" id="navlbl_money">账目</span></button>
  </div></div>
</div>
<div id="modalRoot"><div id="modalOverlay" onclick="closeModal()"></div><div id="modalCard"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- constants ---------------- */
const DEFAULT_REMARKS = "1. 洗碗+加猫粮\n2. 洗碗+加水\n3. wetfood\n4. 打扫+清理猫砂\n5. 陪玩 (若猫咪需要)";
const DEFAULT_TASK_OPTIONS = ['洗碗+加猫粮','洗碗+加水','喂 wetfood','打扫+清理猫砂','陪玩 (若猫咪需要)','喂药 Medication','梳毛 Grooming'];
function visitRemarksText(v){
  const lines=[];
  if(v.tasks && v.tasks.length) v.tasks.forEach((t,i)=> lines.push((i+1)+'. '+t));
  else if(v.remarks) lines.push(v.remarks);
  if(v.extraNotes) lines.push(v.extraNotes);
  return lines.join('\n');
}

const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
async function storageGet(key){
  if(HAS_CLAUDE_STORAGE) return window.storage.get(key, false);
  const raw = localStorage.getItem('wis_'+key);
  if(raw===null) throw new Error('not found');
  return {value: raw};
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE) return window.storage.set(key, value, false);
  localStorage.setItem('wis_'+key, value);
  return true;
}
async function loadAll(){
  for(const k of KEYS){
    try{
      const r = await storageGet(k);
      if(r && r.value!==undefined){
        const val = JSON.parse(r.value);
        if(k==='settings') DB.settings = Object.assign({}, DB.settings, val);
        else DB[k]=val;
      }
    }catch(e){ /* not created yet */ }
  }
}
let __saveQueue = Promise.resolve();
function save(key){
  __saveQueue = __saveQueue.then(()=> saveWithRetry(key, 2));
  return __saveQueue;
}
async function saveWithRetry(key, retriesLeft){
  try{
    await storageSet(key, JSON.stringify(DB[key]));
  }catch(e){
    if(retriesLeft>0){
      await new Promise(r=>setTimeout(r, 400));
      return saveWithRetry(key, retriesLeft-1);
    }
    toast('保存失败，请检查网络 Save failed, check connection');
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ toast('图片读取失败'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function avaColor(seed){ let h=0; for(const c of seed) h+=c.charCodeAt(0); return AVA_COLORS[h%AVA_COLORS.length]; }

/* ---------------- pricing calculator ---------------- */
function suggestedPrice(km, catCount){
  const s = DB.settings;
  km = Number(km)||0; catCount = Number(catCount)||1;
  let price = Number(s.baseRate)||0;
  if(km > Number(s.baseKm)){
    const extra = km - Number(s.baseKm);
    const blocks = Math.ceil(extra / (Number(s.extraKmBlock)||3));
    price += blocks * (Number(s.extraKmRate)||0);
  }
  if(catCount > Number(s.baseCats)){
    price += (catCount - Number(s.baseCats)) * (Number(s.extraCatRate)||0);
  }
  return price;
}

function clientStats(c){
  const invs = DB.invoices.filter(i=>i.clientId===c.id);
  const revenue = invs.reduce((s,i)=> s + (i.payments||[]).reduce((s2,p)=>s2+Number(p.amount),0), 0);
  const serviceCount = invs.reduce((s,i)=>s+((i.visits||[]).length),0);
  const exps = DB.expenses.filter(e=>e.clientId===c.id);
  const hasParking = exps.some(e=>e.category==='停车');
  const hasHighway = exps.some(e=>e.category==='过路费');
  const hasPlatform = exps.some(e=>e.category==='平台费');
  const reimbursable = exps.filter(e=>e.reimbursable).reduce((s,e)=>s+Number(e.amount),0);
  const notReimbursable = exps.filter(e=>!e.reimbursable).reduce((s,e)=>s+Number(e.amount),0);
  return {revenue, serviceCount, hasParking, hasHighway, hasPlatform, reimbursable, notReimbursable, invCount:invs.length};
}

function renderSchedule(){
  const m = state.calMonth; const year=m.getFullYear(), month=m.getMonth();
  const first = new Date(year,month,1); const startDow = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const t = todayStr();
  const apptsByDay = {}; DB.appointments.forEach(a=>{ (apptsByDay[a.date]=apptsByDay[a.date]||[]).push(a); });
  const dayAppts = (DB.appointments.filter(a=>a.date===state.calDay)).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
  return `
  <h1>${tr('scheduleTitle')}</h1>
  <div class="card" style="margin-bottom:8px;">
    <div class="row" style="margin-bottom:10px;">
      <button class="closex" onclick="shiftMonth(-1)">‹</button>
      <h3 style="margin:0;">${year}年${month+1}月</h3>
      <button class="closex" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="cal-grid">
      ${['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells.map(d=>{
        if(!d) return `<div class="cal-cell empty"></div>`;
        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const has = apptsByDay[ds] && apptsByDay[ds].length;
        return `<div class="cal-cell ${ds===t?'today':''} ${ds===state.calDay?'selected':''}" onclick="pickDay('${ds}')">${d}${has?'<span class="dot"></span>':''}</div>`;
      }).join('')}
    </div>
  </div>

function saveAppt(id){
  const date = val('f_appt_date');
  if(!date){ toast('请选择日期'); return; }
  const base = { clientId: val('f_appt_client')||null, title: val('f_appt_title').trim(), start:val('f_appt_start'), end:val('f_appt_end'), notes: val('f_appt_notes').trim() };
  if(id){
    Object.assign(DB.appointments.find(x=>x.id===id), base, {date});
    save('appointments'); state.calDay=date; closeModal(); render(); toast('已保存行程 📅');
    return;
  }
  const isMulti = document.getElementById('f_appt_multi') && document.getElementById('f_appt_multi').checked;
  if(isMulti){
    const endDate = val('f_appt_end_date');
    const interval = Number(val('f_appt_freq'))||1;
    if(!endDate || endDate<date){ toast('请正确选择结束日期'); return; }
    let count=0;
    let d = new Date(date+'T00:00:00'); const endD = new Date(endDate+'T00:00:00');
    while(d<=endD){
      DB.appointments.push(Object.assign({id:uid(), date:d.toISOString().slice(0,10)}, base));
      d.setDate(d.getDate()+interval);
      count++;
    }
    save('appointments'); state.calDay=date; closeModal(); render(); toast(`已批量创建 ${count} 条行程 📅`);
    return;
  }
  DB.appointments.push(Object.assign({id:uid(), date}, base));
  save('appointments'); state.calDay=date; closeModal(); render(); toast('已保存行程 📅');
}
function deleteAppt(id){ DB.appointments = DB.appointments.filter(x=>x.id!==id); save('appointments'); closeModal(); render(); toast('已删除'); }
function exportICS(all){
  const list = all ? DB.appointments : DB.appointments.filter(a=>!a.icsExported);
  if(list.length===0){ toast(all? '还没有任何行程' : '没有新的行程，都已经导出过了 ✅ (可以试试「导出全部」)'); return; }
  let ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//WIS//PetSitting//CN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n';
  list.forEach(a=>{
    const dt = a.date.replace(/-/g,''); const st = (a.start||'09:00').replace(':','')+'00'; const et = (a.end||a.start||'09:30').replace(':','')+'00';
    const c = DB.clients.find(x=>x.id===a.clientId);
    ics += `BEGIN:VEVENT\nUID:${a.id}@wis-app\nDTSTART:${dt}T${st}\nDTEND:${dt}T${et}\nSUMMARY:${(a.title||'上门服务')+(c?(' - '+c.name):'')}\nDESCRIPTION:${(a.notes||'').replace(/\n/g,'\\n')}\nEND:VEVENT\n`;
  });
  ics += 'END:VCALENDAR';
  downloadFile('wis-schedule.ics', ics, 'text/calendar');
  list.forEach(a=> a.icsExported = true);
  save('appointments');
  toast(`已导出 ${list.length} 条新行程，双击打开可直接加入你现有的日历 📅`);
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---- shared invoice/quote model ---- */
function docTotal(doc){
  const visitsTotal = (doc.visits||[]).reduce((s,v)=>s+(Number(v.price)||0),0);
  const cctvTotal = (doc.cctv && doc.cctv.needed) ? (Number(doc.cctv.days)||0)*(Number(doc.cctv.rate)||0) : 0;
  return visitsTotal + cctvTotal;
}
function depositAmt(doc){ return docTotal(doc) * (Number(doc.depositPercent)||50) / 100; }
function invStatus(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
  const total = docTotal(inv);
  if(paid >= total - 0.001 && total>0) return {label:'已付清', cls:'green'};
  if(inv.endDate && inv.endDate < todayStr() && paid < total) return {label:'已逾期', cls:'red'};
  if(paid>0) return {label:'部分付款', cls:'orange'};
  return {label:'待付款', cls:'gray'};
}
function renderDocList(type){
  const list = type==='invoice'? DB.invoices : DB.quotes;
  if(type==='invoice'){
    const outstanding = list.reduce((s,i)=>{ const t=docTotal(i); const p=(i.payments||[]).reduce((a,b)=>a+Number(b.amount),0); return s+Math.max(t-p,0); },0);
    return `
    <div class="statgrid" style="margin-bottom:14px;">
      <div class="statcard"><div class="v">${list.length}</div><div class="l">账单总数</div></div>
      <div class="statcard"><div class="v" style="color:var(--peach-dark)">${fmt(outstanding)}</div><div class="l">未收款项</div></div>
    </div>
    ${list.length? list.slice().reverse().map(i=>invoiceRow(i)).join('') : `<div class="card empty"><span class="emoji">🧾</span>还没有账单，点击右下角 ＋ 新建</div>`}
    `;
  }
  const stmap={draft:['gray','草稿'],sent:['orange','已发送'],accepted:['green','已接受']};
  return list.length? list.slice().reverse().map(q=>{
    const c = DB.clients.find(x=>x.id===q.clientId); const st = stmap[q.status||'draft'];
    return `<div class="card tap" onclick="state.quoteId='${q.id}'; render();">
      <div class="row">
        <div><div style="font-weight:800;">${q.no}</div><div class="muted">${c?c.name:(q.leadName||'未命名客户')} · ${q.startDate||'—'} ~ ${q.endDate||'—'}</div></div>
        <div style="text-align:right;"><div style="font-weight:800;">${fmt(docTotal(q))}</div><span class="pill ${st[0]}">${st[1]}</span></div>
      </div>
    </div>`;
  }).join('') : `<div class="card empty"><span class="emoji">📝</span>还没有报价单，点击右下角 ＋ 新建</div>`;
}
function invoiceRow(inv){

  const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(dest)}&travelmode=driving${avoid}`;
  window.open(url, '_blank');
}
function getClientById(id){ return DB.clients.find(x=>x.id===id); }
function toggleCctvFields(){ document.getElementById('cctvFields').style.display = document.getElementById('f_doc_cctv_needed').checked? 'block':'none'; }
function regenerateVisits(){
  const start = val('f_doc_start'), end = val('f_doc_end');
  if(!start||!end||end<start){ toast('请先正确选择起止日期'); return; }
  const freqVal = val('f_doc_freq');
  const interval = freqVal==='twice' ? 1 : (Number(freqVal)||1);
  const perDay = freqVal==='twice' ? 2 : 1;
  const timeSlot = val('f_doc_timeslot');
  const dates=[]; let d=new Date(start+'T00:00:00'); const endD=new Date(end+'T00:00:00');
  while(d<=endD){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+interval); }
  window.__visits = [];
  dates.forEach(ds=>{
    for(let n=0; n<perDay; n++){
      window.__visits.push({id:uid(), date:ds, timeSlot: perDay>1? (timeSlot+(n===0?' (第1次 / 1st)':' (第2次 / 2nd)')) : timeSlot, tasks: DB.settings.taskOptions.slice(), extraNotes:'', price:0});
    }
  });
  const cctvDaysInput = document.getElementById('f_doc_cctv_days');
  if(cctvDaysInput) cctvDaysInput.value = daysBetweenInclusive(start,end);
  renderVisitRows();
  toast(`已生成 ${window.__visits.length} 条行程`);
}
function addVisitRow(){
  window.__visits.push({id:uid(), date: val('f_doc_end')||todayStr(), timeSlot: val('f_doc_timeslot')||'', tasks: DB.settings.taskOptions.slice(), extraNotes:'', price:0});
  renderVisitRows();
}
function toggleVisitTask(visitIdx, optIdx, checked){
  const opt = DB.settings.taskOptions[optIdx];
  const v = window.__visits[visitIdx];
  if(!v.tasks) v.tasks=[];
  if(checked){ if(!v.tasks.includes(opt)) v.tasks.push(opt); }
  else { v.tasks = v.tasks.filter(t=>t!==opt); }
}

  if(type==='invoice'){

  });

    data.id = uid();
    if(type==='invoice'){ data.no='INV-'+new Date().getFullYear()+'-'+String(DB.settings.invoiceSeq++).padStart(3,'0'); data.payments=[]; DB.invoices.push(data); state.invId=data.id; }

function syncInvoiceToSchedule(inv, force){
  if(inv.scheduleSynced && !force) return 0;
  DB.appointments = DB.appointments.filter(a=> a.sourceInvoiceId !== inv.id);
  const c = DB.clients.find(x=>x.id===inv.clientId);
  let count=0;
  (inv.visits||[]).forEach(v=>{
    DB.appointments.push({
      id:uid(), clientId:inv.clientId,
      title:(c?c.name+' - ':'')+'上门喂猫服务',
      date:v.date, start:'', end:'',
      notes:(v.timeSlot?('时间段：'+v.timeSlot+'\n'):'')+visitRemarksText(v),
      sourceInvoiceId:inv.id,
    });
    count++;
  });
  inv.scheduleSynced = true;
  save('appointments');
  return count;
}
function resyncInvoiceSchedule(invId){
  const inv = DB.invoices.find(x=>x.id===invId);
  const n = syncInvoiceToSchedule(inv, true);
  save('invoices'); render();
  toast(`日程已重新整理，共 ${n} 条，重复的已清掉 🧹`);
}
function savePayment(invId){
  const btn = document.getElementById('btn_save_payment');
  if(btn && btn.disabled) return;
  if(btn) btn.disabled = true;
  const amt = Number(val('f_pay_amt'));
  if(!amt || amt<=0){ toast('请输入有效金额'); if(btn) btn.disabled=false; return; }
  const inv = DB.invoices.find(x=>x.id===invId);
  const total = docTotal(inv);
  const paidSoFar = (inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
  const remaining = Math.max(total-paidSoFar, 0);
  if(amt > remaining + 0.01){ toast(`超过剩余应付金额 ${fmt(remaining)}，请重新输入`); if(btn) btn.disabled=false; return; }
  if(!inv.payments) inv.payments=[];
  inv.payments.push({amount:amt, date:val('f_pay_date'), method:val('f_pay_method'), note:val('f_pay_note').trim()});
  const paidTotal = inv.payments.reduce((s,p)=>s+Number(p.amount),0);
  let msg = '付款已记录 💰';
  if(!inv.scheduleSynced && paidTotal >= depositAmt(inv)){
    const n = syncInvoiceToSchedule(inv);
    if(n>0){
      msg = `付款已记录 💰 已自动生成 ${n} 条日程 📅`;
      const firstDate = (inv.visits||[]).map(v=>v.date).sort()[0];
      if(firstDate){ state.calMonth = new Date(firstDate+'T00:00:00'); state.calDay = firstDate; }
    }
  }
  save('invoices'); closeModal(); render(); toast(msg);
}
function deletePayment(invId, idx){
  confirmAction('确定要删除这笔付款记录吗？Delete this payment record?', ()=>{
    const inv = DB.invoices.find(x=>x.id===invId);
    if(!inv || !inv.payments) return;
    inv.payments.splice(idx,1);
    save('invoices'); render(); toast('已删除付款记录 Payment deleted');
  });
}

/* ---------------- PDF export ---------------- */
function genPDF(type, id, mode){
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if(!mode){ mode = HAS_CLAUDE_STORAGE ? 'inline' : (isMobile ? 'view' : undefined); }
  let preOpenedWindow = null;
  if(mode==='view'){
    // Must open synchronously inside the click handler — Safari silently blocks
    // window.open() calls made after async work (e.g. after html2canvas finishes).
    preOpenedWindow = window.open('', '_blank');
    if(preOpenedWindow) preOpenedWindow.document.write('<body style="font-family:sans-serif; padding:24px; color:#888;">正在生成 PDF… Generating PDF…</body>');
  }
  toast('正在生成 PDF…');
  const doc = type==='invoice' ? DB.invoices.find(x=>x.id===id) : DB.quotes.find(x=>x.id===id);
  const c = DB.clients.find(x=>x.id===doc.clientId) || {};
  const pets = c.pets || [];
  const visitsTotal = (doc.visits||[]).reduce((s,v)=>s+(Number(v.price)||0),0);
  const cctvOn = doc.cctv && doc.cctv.needed;
  const cctvTotal = cctvOn? (Number(doc.cctv.days)||0)*(Number(doc.cctv.rate)||0) : 0;
  const total = visitsTotal + cctvTotal;
  const dep = depositAmt(doc);
  const totalDays = daysBetweenInclusive(doc.startDate, doc.endDate);
  const catCount = doc.catCount || pets.length || 1;
  const km = c.km || (doc.route && doc.route.distanceKm) || 0;
  const est = km? suggestedPrice(km, catCount) : null;

  const visitRows = (doc.visits||[]).map(v=>`
    <tr>
      <td style="padding:8px 6px; border-top:1px solid #EDE2D0;">${v.date}</td>
      <td style="padding:8px 6px; border-top:1px solid #EDE2D0;">${dowLabel(v.date)}</td>
      <td style="padding:8px 6px; border-top:1px solid #EDE2D0; background:#F4ECDF;">${v.timeSlot||''}</td>
      <td style="padding:8px 6px; border-top:1px solid #EDE2D0; background:#F4ECDF; white-space:pre-line; font-size:12px;">${visitRemarksText(v).replace(/</g,'&lt;')}</td>
      <td style="padding:8px 6px; border-top:1px solid #EDE2D0; text-align:right; font-weight:700;">${fmt(v.price)}</td>
    </tr>`).join('');
  const cctvRow = cctvOn? `
    <tr>
      <td colspan="4" style="padding:8px 6px; border-top:2px solid #EDE2D0; font-weight:700;">${doc.startDate||''} ~ ${doc.endDate||''}（${doc.cctv.days} days） · CCTV 租用 CCTV Rental</td>
      <td style="padding:8px 6px; border-top:2px solid #EDE2D0; text-align:right; font-weight:700;">${fmt(cctvTotal)}</td>
    </tr>` : '';

  const petBlocks = pets.length? pets.map(p=>`
    <div style="display:flex; gap:16px; margin-bottom:14px;">
      <div style="flex:1;">
        <table style="width:100%; font-size:13px; border-collapse:collapse;">
          <tr><td style="color:#9C8F7E; padding:3px 0; width:40%;">Pet Name</td><td style="font-weight:700;">${p.name}</td></tr>
          <tr><td style="color:#9C8F7E; padding:3px 0;">Gender</td><td>${p.gender||'—'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:3px 0;">Sick/Pregnant?</td><td>${p.sickPregnant==='是'?'Yes 是':'No 否'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:3px 0;">CCTV needed?</td><td>${p.cctvNeeded?'Yes':'No'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:3px 0; vertical-align:top;">Remarks</td><td style="white-space:pre-line;">${p.notes||p.medical||'—'}</td></tr>
        </table>
      </div>
      ${p.photo? `<img src="${p.photo}" style="width:110px;height:110px;object-fit:cover;border-radius:14px;">` : ''}
    </div>`).join('') : `<div style="color:#9C8F7E; font-size:13px;">${c.id? '未登记宠物资料 No pet profile yet' : '报价阶段暂无宠物资料 No pet profile at quote stage'}</div>`;

  const qrBlocks = (DB.settings.qrCodes||[]).map(q=>`
    <div style="background:#fff; border:1px solid #EDE2D0; border-radius:16px; padding:14px; text-align:center; margin-bottom:14px;">
      <div style="font-weight:800; margin-bottom:8px;">${q.label||'收款码 Payment QR'}</div>
      <img src="${q.image}" style="width:150px;height:150px;object-fit:contain;">
    </div>`).join('');

  const estBox = km? `
    <div style="background:#fff; border:1px solid #EDE2D0; border-radius:14px; padding:12px 14px; font-size:12.5px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between;"><span>Total KM</span><span style="font-weight:700;">${km}</span></div>
      <div style="display:flex; justify-content:space-between;"><span>No. of cats</span><span style="font-weight:700;">${catCount}</span></div>
      <div style="height:1px;background:#EDE2D0;margin:6px 0;"></div>
      <div style="display:flex; justify-content:space-between;"><span>1st ${DB.settings.baseKm}km (${DB.settings.baseCats} cats included)</span><span>${fmt(DB.settings.baseRate)}</span></div>
      <div style="display:flex; justify-content:space-between;"><span>(+) remaining km</span><span>${fmt(est-DB.settings.baseRate>0?est-DB.settings.baseRate:0)}</span></div>
      <div style="height:1px;background:#EDE2D0;margin:6px 0;"></div>
      <div style="display:flex; justify-content:space-between; font-weight:800;"><span>单次价格 Per Visit</span><span>${fmt(est)}</span></div>
    </div>` : '';

  const careAnswers = (c.careInfo && QA_FIELDS.some(([k])=>c.careInfo[k])) ? `
    <div style="background:#fff; border:1px solid #EDE2D0; border-radius:14px; padding:14px 18px; margin-bottom:16px;">
      <div style="font-weight:800; margin-bottom:6px;">居家须知 Home Care Notes</div>
      <table style="width:100%; font-size:12.5px; border-collapse:collapse;">
        ${QA_FIELDS.map(([k,label])=> c.careInfo[k]? `<tr><td style="color:#9C8F7E; padding:3px 0; width:40%; vertical-align:top;">${label}</td><td>${String(c.careInfo[k]).replace(/</g,'&lt;')}</td></tr>` : '').join('')}
      </table>
    </div>` : '';

  const wrap = document.createElement('div');
  wrap.style.cssText='position:fixed; left:-9999px; top:0; width:860px; background:#fff; padding:36px; font-family:Nunito,sans-serif; color:#3E362C;';
  wrap.innerHTML = `
  <div style="display:flex; gap:24px;">
    <div style="flex:1; min-width:0;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px;">
        <div style="display:flex; align-items:center; gap:10px;">
          <img src="${LOGO_B64}" style="width:44px;height:44px;border-radius:12px;object-fit:cover;">
          <div>
            <div style="font-size:22px; font-weight:800; color:#6C8B72;">${DB.settings.businessName}</div>
            <div style="color:#9C8F7E; margin-top:2px; font-size:13px;">${type==='invoice'?'账单 INVOICE':'报价单 QUOTATION'} · ${doc.no}</div>
          </div>
        </div>
        <div style="text-align:right; color:#9C8F7E; font-size:12px;">生成日期 Date: ${todayStr()}</div>
      </div>

      <div style="background:#F4ECDF; border-radius:14px; padding:14px 18px; margin-bottom:16px;">
        <div style="font-weight:800; margin-bottom:6px;">Customer Info</div>
        <table style="width:100%; font-size:13px; border-collapse:collapse;">
          <tr><td style="color:#9C8F7E; padding:2px 0; width:32%;">Owner Name</td><td>${c.name||doc.leadName||'—'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:2px 0;">Contact Number</td><td>${c.phone||doc.leadPhone||'—'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:2px 0; vertical-align:top;">Address</td><td>${c.address||(doc.route&&doc.route.destination)||'—'}</td></tr>
          <tr><td style="color:#9C8F7E; padding:2px 0;">Date</td><td>${doc.startDate||'—'} ~ ${doc.endDate||'—'}（${totalDays} days）</td></tr>
          <tr><td style="color:#9C8F7E; padding:2px 0;">Time Slot</td><td>${doc.timeSlot||'—'}</td></tr>
        </table>
      </div>

      ${careAnswers}
      <div style="font-weight:800; margin-bottom:8px;">Cat(s) Info</div>
      ${petBlocks}

      <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:6px;">
        <tr style="background:#8CA891; color:#fff;">
          <th style="padding:8px 6px; text-align:left;">Date</th><th style="padding:8px 6px; text-align:left;">Day</th><th style="padding:8px 6px; text-align:left;">Time Slot</th><th style="padding:8px 6px; text-align:left;">Remarks</th><th style="padding:8px 6px; text-align:right;">Price (RM)</th>
        </tr>
        ${visitRows}
        ${cctvRow}
      </table>

      <div style="margin-top:14px; font-size:12px; color:#6b5f4f; white-space:pre-line;">${(DB.settings.serviceNotes||'').split('\n').map(l=>'** '+l).join('\n')}</div>

      <div style="margin-top:14px; background:#F4ECDF; border-radius:14px; padding:14px 18px; max-width:320px; margin-left:auto;">
        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span>总额 Total</span><span style="font-weight:800;">${fmt(total)}</span></div>
        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span>定金 Deposit (${doc.depositPercent||50}%)</span><span>${fmt(dep)}</span></div>
        <div style="display:flex; justify-content:space-between; padding:3px 0;"><span>尾款 Remaining</span><span>${fmt(total-dep)}</span></div>
      </div>

      <div style="margin-top:16px; font-size:11.5px; color:#D97066; white-space:pre-line;">${DB.settings.terms||''}</div>
      ${doc.notes? `<div style="margin-top:10px; font-size:12px; color:#6b5f4f;">备注 Notes: ${doc.notes}</div>`:''}
    </div>
    <div style="width:190px; flex:none;">
      ${estBox}
      ${qrBlocks}
    </div>
  </div>
  <div style="margin-top:18px; text-align:center; color:#c9bda3; font-size:12px;">🐾 感谢您的信任，我们会好好照顾您的猫咪 Thank you for trusting us with your cats 🐾</div>
  `;
  document.body.appendChild(wrap);

  const imgs = Array.from(wrap.querySelectorAll('img'));
  const waitForImages = Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=res; img.onerror=res; })));

  waitForImages.then(()=> html2canvas(wrap, {scale:1.5, backgroundColor:'#ffffff', useCORS:true})).then(canvas=>{
    document.body.removeChild(wrap);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth(); const pageH = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pageW / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    if(imgH <= pageH){
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
    } else {
      // split across multiple pages
      let heightLeft = imgH, position = 0;
      pdf.addImage(imgData, 'JPEG', 0, position, pageW, imgH);
      heightLeft -= pageH;
      while(heightLeft > 0){
        position -= pageH; pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, pageW, imgH);
        heightLeft -= pageH;
      }
    }
    if(mode==='inline'){
      openModal(`
        <div class="modalhead"><h2>PDF 预览 Preview</h2><button class="closex" onclick="closeModal()">✕</button></div>
        <div class="muted" style="margin-bottom:10px; font-size:12.5px; line-height:1.6;">这是账单内容预览，用来核对内容对不对。Claude对话框里有下载限制，没办法真的存成文件——如果要保存/发给客户，请把这个App托管到网页后用手机/电脑浏览器打开再下载或截图。<br>This is a content preview to check everything looks right. Claude's chat sandbox blocks real downloads — to actually save or send this, open the hosted version of this app in a real browser.</div>
        <img src="${imgData}" style="width:100%; border-radius:8px; border:1px solid #EDE2D0;">
      `);
      toast('PDF 内容预览 📄');
      return;
    }
    if(mode==='view'){
      const blobUrl = pdf.output('bloburl');
      if(preOpenedWindow && !preOpenedWindow.closed){ preOpenedWindow.location.href = blobUrl; }
      else { window.open(blobUrl, '_blank'); }
      toast('PDF 已在新页面打开 📄');
      return;
    }
    try{
      pdf.save(`${doc.no}.pdf`);
      toast('PDF 已生成，可分享啦 📄');
    }catch(saveErr){
      console.error('pdf.save failed, falling back to new tab:', saveErr);
      const blobUrl = pdf.output('bloburl');
      window.open(blobUrl, '_blank');
      toast('PDF 已在新页面打开，长按/右键即可保存 📄');
    }
  }).catch((err)=>{
    if(document.body.contains(wrap)) document.body.removeChild(wrap);
    if(preOpenedWindow && !preOpenedWindow.closed){ try{ preOpenedWindow.close(); }catch(e){} }
    console.error('PDF generation failed:', err);
    toast('生成失败：'+(err&&err.message? err.message.slice(0,60) : '请重试'));
  });
}

/* ---------------- settings ---------------- */
function openSettings(){ document.getElementById('modalCard').innerHTML = settingsHTML(); document.getElementById('modalRoot').classList.add('open'); }
function settingsHTML(){
  const s = DB.settings;
  const qrList = (s.qrCodes||[]).map((q,idx)=>`
    <div class="qrmini"><img src="${q.image}"><div style="flex:1;"><div style="font-weight:800;">${q.label}</div></div><button class="miniremove" onclick="removeQR(${idx})">✕</button></div>`).join('');
  return `
  <div class="modalhead"><h2>设置 Settings</h2><button class="closex" onclick="closeModal()">✕</button></div>

  <div class="card" style="background:#F4ECDF; border:none; margin-bottom:14px;">
    <h3>📲 加到手机主屏幕 Add to Home Screen</h3>
    <div class="muted" style="font-size:12.5px; line-height:1.7;">
      在 iPhone 上用 <b>Safari</b> 打开这个页面 → 点底部分享图标 ⬆️ → 选「添加到主屏幕」，就会有一个图标可以直接打开，不用每次都进 Claude。<br><br>
      On iPhone: open this page in <b>Safari</b> → tap the Share icon ⬆️ → "Add to Home Screen". You'll get an app-like icon you can open directly.
    </div>
  </div>

  <label class="flabel">工作室 / 品牌名称 Business Name</label><input id="f_biz_name" value="${s.businessName}">
  <label class="flabel">出发地址（报价时默认出发地点）Default origin address</label><input id="f_biz_address" value="${s.businessAddress||''}" placeholder="你的常用出发地址">

  <div class="divider"></div>
  <h3>💰 计价规则</h3>
  <div class="row" style="gap:10px;"><div style="flex:1;"><label class="flabel">起步价 (RM)</label><input type="number" id="f_s_baseRate" value="${s.baseRate}"></div><div style="flex:1;"><label class="flabel">起步里程 (km)</label><input type="number" id="f_s_baseKm" value="${s.baseKm}"></div></div>
  <div class="row" style="gap:10px;"><div style="flex:1;"><label class="flabel">每额外几公里 +费用</label><input type="number" id="f_s_extraKmBlock" value="${s.extraKmBlock}"></div><div style="flex:1;"><label class="flabel">每段额外里程费 (RM)</label><input type="number" id="f_s_extraKmRate" value="${s.extraKmRate}"></div></div>
  <div class="row" style="gap:10px;"><div style="flex:1;"><label class="flabel">起步含猫数</label><input type="number" id="f_s_baseCats" value="${s.baseCats}"></div><div style="flex:1;"><label class="flabel">每多一只猫 +费用 (RM)</label><input type="number" id="f_s_extraCatRate" value="${s.extraCatRate}"></div></div>
  <div class="row" style="gap:10px;"><div style="flex:1;"><label class="flabel">CCTV 每日租金 (RM)</label><input type="number" id="f_s_cctvRate" value="${s.cctvDailyRate}"></div><div style="flex:1;"><label class="flabel">默认定金比例 (%)</label><input type="number" id="f_s_deposit" value="${s.depositPercent}"></div></div>

  <div class="divider"></div>
  <div class="muted" style="margin-bottom:2px;">💡 每日服务细节选项现在放在「账目 → 服务类型」里管理，改一次两边都会同步。</div>

  <div class="divider"></div>
  <h3>📄 账单底部文字</h3>
  <label class="flabel">服务须知</label><textarea id="f_s_notes">${s.serviceNotes}</textarea>
  <label class="flabel">条款</label><textarea id="f_s_terms">${s.terms}</textarea>

  <div class="divider"></div>
  <h3>💳 收款二维码</h3>
  <div class="muted" style="margin-bottom:8px;">添加后会自动附在每一份账单 / 报价 PDF 上</div>
  ${qrList || '<div class="muted" style="margin-bottom:10px;">还没有添加收款码</div>'}
  <input id="f_qr_label" placeholder="标签，例如 Maybank / TnG eWallet">
  <input type="file" accept="image/*" id="f_qr_file">
  <button class="btn btn-soft btn-block" style="margin-bottom:14px;" onclick="addQR()">＋ 添加二维码</button>

  <button class="btn btn-primary btn-block" onclick="saveSettings()">保存设置</button>
  `;
}
function addQR(){
  const label = val('f_qr_label').trim();
  const fileInput = document.getElementById('f_qr_file');
  const file = fileInput.files[0];
  if(!label || !file){ toast('请填写标签并选择图片'); return; }
  resizeImageFile(file, 500, (dataUrl)=>{
    if(!DB.settings.qrCodes) DB.settings.qrCodes=[];
    DB.settings.qrCodes.push({label, image:dataUrl});
    save('settings');
    document.getElementById('modalCard').innerHTML = settingsHTML();
    toast('已添加二维码');
  });
}
function removeQR(idx){
  DB.settings.qrCodes.splice(idx,1); save('settings');
  document.getElementById('modalCard').innerHTML = settingsHTML();
}
function saveSettings(){
  Object.assign(DB.settings, {
    businessName: val('f_biz_name').trim() || 'Wisley Meowcare',
    businessAddress: val('f_biz_address').trim(),
    baseRate:Number(val('f_s_baseRate'))||0, baseKm:Number(val('f_s_baseKm'))||0,
    extraKmBlock:Number(val('f_s_extraKmBlock'))||1, extraKmRate:Number(val('f_s_extraKmRate'))||0,
    baseCats:Number(val('f_s_baseCats'))||0, extraCatRate:Number(val('f_s_extraCatRate'))||0,
    cctvDailyRate:Number(val('f_s_cctvRate'))||0, depositPercent:Number(val('f_s_deposit'))||50,
    serviceNotes: val('f_s_notes'), terms: val('f_s_terms'),
  });
  save('settings');
  document.getElementById('brandName').textContent = DB.settings.businessName;
  closeModal(); toast('设置已保存');
}

/* ---------------- init ---------------- */
loadAll().then(()=>{
  document.getElementById('brandName').textContent = DB.settings.businessName;
  document.getElementById('logoImg').src = LOGO_B64;
  state.lang = DB.settings.lang || 'zh';
  const langBtn = document.getElementById('langBtn'); if(langBtn) langBtn.textContent = state.lang==='zh'?'EN':'中';
  render();
});
</script>
</body>
