<style>
  :root{
    --bg:#FBF6EE;
    --card:#FFFFFF;
    --card-alt:#F4ECDF;
    --ink:#3E362C;
    --ink-light:#9C8F7E;
    --sage:#8CA891;
    --sage-dark:#6C8B72;
    --peach:#F3A57E;
    --peach-dark:#E68A57;
    --honey:#E7B04E;
    --rose:#E6A0A6;
    --danger:#D97066;
    --line:#EDE2D0;
    --radius:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0; overflow-x:hidden; overscroll-behavior-y:contain;}
  body{font-family:'Nunito',sans-serif; background:var(--bg); color:var(--ink); display:flex; justify-content:center;}
  #shell{
    width:100%; max-width:460px; min-height:100vh; background:var(--bg); position:relative; padding-bottom:92px; overflow-x:hidden;
    background-image:
      radial-gradient(circle at 92% 4%, rgba(140,168,145,0.10) 0, transparent 40%),
      radial-gradient(circle at 6% 14%, rgba(243,165,126,0.10) 0, transparent 35%);
  }
  h1,h2,h3,.brand,.tabbtn span.label{font-family:'Fredoka',sans-serif;}
  h1{font-size:26px;margin:0 0 2px;}
  h2{font-size:19px;margin:0 0 10px;}
  h3{font-size:15px;margin:0 0 6px;color:var(--ink);}
  #topbar{padding:22px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:20px;color:var(--sage-dark);}
  .brand .pawmark{width:30px;height:30px;flex:none;}
  .headerbtn{background:var(--card); border:1px solid var(--line); color:var(--sage-dark); width:38px;height:38px;border-radius:14px; display:flex;align-items:center;justify-content:center; font-size:18px; cursor:pointer;}
  #screen{padding:0 16px 20px;}
  .card{background:var(--card); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:0 2px 14px rgba(80,60,30,0.05); border:1px solid var(--line);}
  .card.tap{cursor:pointer; transition:transform .12s ease;}
  .card.tap:active{transform:scale(0.98);}
  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .muted{color:var(--ink-light); font-size:13px;}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:99px; font-size:12px; font-weight:800; background:var(--card-alt); color:var(--sage-dark);}
  .pill.orange{background:#FCEBDD;color:var(--peach-dark);}
  .pill.green{background:#E5F0E4;color:var(--sage-dark);}
  .pill.red{background:#FBE4E1;color:var(--danger);}
  .pill.gray{background:#F1ECE3;color:var(--ink-light);}
  .btn{border:none; border-radius:16px; padding:12px 16px; font-weight:800; font-size:14.5px; cursor:pointer; font-family:'Nunito',sans-serif; display:inline-flex;align-items:center;gap:6px;justify-content:center;}
  .btn-primary{background:var(--sage); color:#fff;}
  .btn-primary:active{background:var(--sage-dark);}
  .btn-peach{background:var(--peach); color:#fff;}
  .btn-peach:active{background:var(--peach-dark);}
  .btn-soft{background:var(--card-alt); color:var(--ink);}
  .btn-outline{background:transparent;border:1.5px solid var(--sage);color:var(--sage-dark);}
  .btn-danger{background:#FBE4E1;color:var(--danger);}
  .btn-sm{padding:8px 12px; font-size:12.5px; border-radius:12px;}
  .btn-block{width:100%;}
  #fabWrap{position:fixed; inset:0; pointer-events:none; display:flex; justify-content:center; z-index:40;}
  #fabInner{position:relative; width:100%; max-width:460px; height:100%;}
  .fab{position:absolute; right:18px; bottom:110px; width:56px;height:56px;border-radius:20px; background:var(--peach); color:#fff; display:flex;align-items:center;justify-content:center;font-size:26px; border:none; box-shadow:0 8px 18px rgba(230,138,87,0.4); cursor:pointer; pointer-events:auto;}
  #bottomnav{position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:center;}
  #navwrap{width:100%; max-width:460px; background:rgba(255,255,255,0.92); backdrop-filter:blur(6px); border-top:1px solid var(--line); display:flex; padding:8px 6px 14px;}
  .tabbtn{flex:1; background:none;border:none; display:flex;flex-direction:column;align-items:center;gap:3px; padding:6px 2px; color:var(--ink-light); cursor:pointer;}
  .tabbtn.active{color:var(--sage-dark);}
  .tabbtn .ic{font-size:20px;}
  .tabbtn span.label{font-size:11px;font-weight:600;}
  input,select,textarea{width:100%; font-family:'Nunito',sans-serif; font-size:14.5px; color:var(--ink); background:var(--card-alt); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin-bottom:12px; outline:none;}
  textarea{resize:vertical; min-height:56px;}
  label.flabel{font-size:12.5px; font-weight:800; color:var(--ink-light); margin:0 0 5px 2px; display:block;}
  .divider{height:1px;background:var(--line); margin:14px 0;}
  .empty{text-align:center; padding:50px 20px; color:var(--ink-light);}
  .empty .emoji{font-size:44px; display:block; margin-bottom:10px;}
  .avatar{width:44px;height:44px;border-radius:14px; display:flex;align-items:center;justify-content:center; color:#fff; font-weight:800; font-size:15px; flex:none;}
  .searchbar{position:relative;}
  .searchbar input{padding-left:36px; padding-right:36px;}
  .searchbar .sic{position:absolute; left:12px; top:11px; opacity:0.5;}
  .searchbar .clr{position:absolute; right:8px; top:6px; width:26px; height:26px; border:none; background:none; color:var(--ink-light); font-size:15px; cursor:pointer; display:none;}
  .searchbar.has-value .clr{display:block;}
  #modalRoot{position:fixed; inset:0; z-index:100; display:none;}
  #modalRoot.open{display:flex; align-items:flex-end; justify-content:center;}
  #modalOverlay{position:absolute; inset:0; background:rgba(50,40,25,0.38);}
  #modalCard{position:relative; width:100%; max-width:460px; max-height:88vh; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border-radius:26px 26px 0 0; padding:0 18px 26px; animation:slideup .18s ease-out;}
  #modalCloseFab{display:none; position:absolute; bottom:24px; right:24px; z-index:110; width:48px; height:48px; border-radius:50%; border:none; background:rgba(50,40,25,0.75); color:#fff; font-size:20px; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,0.3);}
  #modalRoot.open #modalCloseFab{display:flex;}
  #loadingScreen{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; background:var(--bg);}
  #loginScreen{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; background:var(--bg); padding:20px;}
  .loginbox{width:100%; max-width:360px; background:var(--card); border-radius:24px; padding:28px 24px; box-shadow:0 10px 30px rgba(0,0,0,0.08); text-align:center;}
  .loginbox input{text-align:left;}
  .loginbox .flabel{text-align:left;}
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0);opacity:1;}}
  .confetti-wrap{position:relative; height:0; overflow:visible; margin-top:-6px;}
  .confetti-piece{position:absolute; top:-24px; font-size:22px; animation-name:confettiFall; animation-timing-function:ease-in; animation-fill-mode:forwards; pointer-events:none;}
  @keyframes confettiFall{0%{transform:translateY(0) rotate(0deg); opacity:1;} 100%{transform:translateY(340px) rotate(360deg); opacity:0;}}
  .modalhead{display:flex; align-items:center; justify-content:space-between; margin:0 -18px 14px; padding:18px 18px 10px; position:-webkit-sticky; position:sticky; top:0; background:var(--bg); z-index:5;}
  .closex{width:32px;height:32px;border-radius:12px;background:var(--card-alt); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--ink-light); font-size:16px;}
  table.simple{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.simple th{text-align:left; color:var(--ink-light); font-size:11.5px; padding:4px 6px; font-weight:800;}
  table.simple td{padding:8px 6px; border-top:1px solid var(--line);}
  .miniremove{background:#FBE4E1;color:var(--danger); border:none; width:30px;height:30px;border-radius:10px;flex:none;cursor:pointer;font-size:15px;}
  .totalline{display:flex; justify-content:space-between; padding:5px 0; font-size:14px;}
  .totalline.big{font-weight:800; font-size:17px; padding-top:8px; border-top:1px dashed var(--line); margin-top:6px;}
  .subnav{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
  .subnav::-webkit-scrollbar{display:none;}
  .subchip{flex:none; padding:8px 14px; border-radius:99px; background:var(--card); border:1px solid var(--line); font-weight:800; font-size:13px; color:var(--ink-light); cursor:pointer; white-space:nowrap;}
  .toptabs{display:flex; gap:22px; border-bottom:2px solid var(--line); margin-bottom:16px;}
  .toptab{padding-bottom:10px; font-weight:800; font-size:14.5px; color:var(--ink-light); cursor:pointer; border-bottom:3px solid transparent; margin-bottom:-2px; white-space:nowrap;}
  .toptab.active{color:var(--sage-dark); border-bottom-color:var(--sage-dark);}
  .segwrap{display:flex; background:var(--card-alt); border-radius:12px; padding:3px; margin-bottom:10px;}
  .segbtn{flex:1; text-align:center; padding:8px 0; border-radius:9px; font-weight:800; font-size:12.5px; color:var(--ink-light); cursor:pointer;}
  .segbtn.active{background:var(--sage); color:#fff; box-shadow:0 2px 6px rgba(0,0,0,0.1);}
  .subchip.active{background:var(--sage); color:#fff; border-color:var(--sage);}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .catgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .cattile{position:relative; aspect-ratio:1; border-radius:16px; overflow:hidden; background:var(--card-alt); cursor:pointer;}
  .cattile img{width:100%; height:100%; object-fit:cover; display:block;}
  .cattile-ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:28px; opacity:0.4;}
  .cattile-label{position:absolute; left:0; right:0; bottom:0; padding:5px 6px 4px; font-size:11.5px; font-weight:800; color:#fff; text-align:center; background:linear-gradient(transparent, rgba(0,0,0,0.55)); text-shadow:0 1px 2px rgba(0,0,0,0.4);}
  .flag-marker{font-size:22px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,0.3));}
  .statcard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px;}
  .statcard .v{font-size:20px; font-weight:800; font-family:'Fredoka',sans-serif;}
  .statcard .l{font-size:12px; color:var(--ink-light); margin-top:2px;}
  .paw-divider{display:flex; justify-content:center; gap:10px; opacity:0.35; margin:6px 0 14px; font-size:13px;}
  .photobox{width:100%; aspect-ratio:4/3; border-radius:16px; background:var(--card-alt); display:flex;align-items:center;justify-content:center; overflow:hidden; margin-bottom:10px; cursor:pointer; border:1px dashed #cbb99a;}
  .photobox img{width:100%;height:100%;object-fit:cover;}
  .checkline{display:flex; align-items:center; gap:8px; margin-bottom:12px; font-weight:700; font-size:14px;}
  .checkline input{width:auto; margin:0;}
  .toast{position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:99px; font-size:13.5px; font-weight:700; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}
  .backrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:var(--sage-dark);font-weight:800;cursor:pointer;font-size:14px;}
  .cal-grid{display:flex; flex-wrap:wrap; width:100%; text-align:center;}
  .cal-dow{width:14.2857%; box-sizing:border-box; font-size:11px; color:var(--ink-light); font-weight:800; padding-bottom:6px;}
  .cal-cell{width:14.2857%; box-sizing:border-box; aspect-ratio:1; margin-bottom:4px; display:flex;align-items:center;justify-content:center; border-radius:12px; font-size:13.5px; cursor:pointer; position:relative; font-weight:700; color:var(--ink);}
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today{border:1.5px solid var(--sage);}
  .cal-cell.selected{background:var(--sage); color:#fff;}
  .cal-cell .dot{position:absolute; bottom:4px; width:5px;height:5px;border-radius:50%;background:var(--peach);}
  .cal-cell.selected .dot{background:#fff;}
  .visitrow{background:var(--card-alt); border-radius:16px; padding:12px; margin-bottom:10px;}
  .visitrow .vtop{display:flex; gap:8px; margin-bottom:8px;}
  .visitrow input, .visitrow textarea{margin-bottom:0;}
  .qaitem{margin-bottom:10px;}
  .qaitem .q{font-size:12.5px; font-weight:800; color:var(--sage-dark); margin-bottom:4px;}
  .qrmini{display:flex; align-items:center; gap:10px; background:var(--card-alt); border-radius:14px; padding:8px 10px; margin-bottom:8px;}
  .qrmini img{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#fff;}
</style>
</head>
<body>
<div id="loginScreen" style="display:none;">
  <div class="loginbox">
    <img id="loginLogo" src="" style="width:64px;height:64px;border-radius:18px;object-fit:cover;margin-bottom:14px;">
    <h2 style="margin:0 0 4px;">Wisley Meowcare</h2>
    <div class="muted" style="margin-bottom:20px;">登录后数据会在你的手机和电脑之间同步<br>Sign in to sync your data across devices</div>
    <label class="flabel">邮箱 Email</label><input id="f_login_email" type="email" placeholder="you@example.com">
    <label class="flabel">密码 Password</label><input id="f_login_pass" type="password" placeholder="••••••••">
    <div id="loginError" class="muted" style="color:#D97066; margin:6px 0 0; min-height:16px; font-size:12.5px;"></div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="doLogin()">登录 Sign in</button>
  </div>
</div>
<div id="shell" style="display:none;">
  <div id="topbar">
    <div class="brand"><img class="pawmark" id="logoImg" src="" style="width:34px;height:34px;border-radius:10px;object-fit:cover;"><span id="brandName">Wisley Meowcare</span></div>
    <button class="headerbtn" id="langBtn" onclick="toggleLang()" style="font-weight:800; font-size:13px;">EN</button>
    <button class="headerbtn" onclick="openSettings()">⚙️</button>
  </div>
  <div id="screen"></div>
  <div id="fabWrap"><div id="fabInner"><button class="fab" id="fabBtn" onclick="onFab()">＋</button></div></div>
  <div id="bottomnav"><div id="navwrap">
    <button class="tabbtn" data-tab="today" onclick="setTab('today')"><span class="ic">🏠</span><span class="label" id="navlbl_today">今天</span></button>
    <button class="tabbtn" data-tab="clients" onclick="setTab('clients')"><span class="ic">🐾</span><span class="label" id="navlbl_clients">客户</span></button>
    <button class="tabbtn" data-tab="cats" onclick="setTab('cats')"><span class="ic">🐱</span><span class="label" id="navlbl_cats">猫咪</span></button>
    <button class="tabbtn" data-tab="money" onclick="setTab('money')"><span class="ic">💰</span><span class="label" id="navlbl_money">账目</span></button>
    <button class="tabbtn" data-tab="reports" onclick="setTab('reports')"><span class="ic">📊</span><span class="label" id="navlbl_reports">报表</span></button>
    <button class="tabbtn" data-tab="social" onclick="setTab('social')"><span class="ic">📱</span><span class="label" id="navlbl_social">社交</span></button>
  </div></div>
</div>
<div id="modalRoot"><div id="modalOverlay" onclick="closeModal()"></div><div id="modalCard"></div><button id="modalCloseFab" onclick="closeModal()">✕</button></div>
<div class="toast" id="toast"></div>
<div id="loadingScreen" style="display:flex;"><span class="emoji" style="font-size:36px;">🐾</span></div>

<script>
/* ---------------- constants ---------------- */

  const lines=[];

  if(v.extraNotes) lines.push(v.extraNotes);
  return lines.join('\n');

const FS_CHUNK_SIZE = 700000; // stay safely under Firestore's ~1MB per-document limit
async function storageGet(key){
  if(fbUser){
    const dataCol = fbDB.collection('users').doc(fbUser.uid).collection('data');
    const doc = await dataCol.doc(key).get();
    if(!doc.exists) throw new Error('not found');
    const data = doc.data();
    if(data.chunks){
      let full = '';
      for(let i=0;i<data.chunks;i++){
        const c = await dataCol.doc(key+'__c'+i).get();
        full += (c.exists ? c.data().value : '');
      }
      return {value: full};
    }
    if(data.value===undefined) throw new Error('not found');
    return {value: data.value};
  }
  if(HAS_CLAUDE_STORAGE) return window.storage.get(key, false);
  const raw = localStorage.getItem('wis_'+key);
  if(raw===null) throw new Error('not found');
  return {value: raw};
}
async function storageSet(key, value){
  if(fbUser){
    const dataCol = fbDB.collection('users').doc(fbUser.uid).collection('data');
    const docRef = dataCol.doc(key);
    const prevSnap = await docRef.get();
    const prevChunks = (prevSnap.exists && prevSnap.data().chunks) || 0;
    if(value.length <= FS_CHUNK_SIZE){
      await docRef.set({value, chunks:0});
    } else {
      const n = Math.ceil(value.length / FS_CHUNK_SIZE);
      for(let i=0;i<n;i++){
        const part = value.slice(i*FS_CHUNK_SIZE, (i+1)*FS_CHUNK_SIZE);
        await dataCol.doc(key+'__c'+i).set({value: part});
      }
      await docRef.set({chunks:n});
    }
    const newChunks = value.length <= FS_CHUNK_SIZE ? 0 : Math.ceil(value.length / FS_CHUNK_SIZE);
    for(let i=newChunks;i<prevChunks;i++){ dataCol.doc(key+'__c'+i).delete().catch(()=>{}); }
    return true;
  }
  if(HAS_CLAUDE_STORAGE) return window.storage.set(key, value, false);
  localStorage.setItem('wis_'+key, value);
  return true;
}

async function saveWithRetry(key, retriesLeft){

    console.error('Save failed for key:', key, e);
    if(retriesLeft>0){

      return saveWithRetry(key, retriesLeft-1);

function resizeImageFile(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxDim/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>{ toast('图片读取失败'); };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- pricing calculator ---------------- */
function suggestedPrice(km, catCount){
  const s = DB.settings;
  km = Number(km)||0; catCount = Number(catCount)||1;
  let price = Number(s.baseRate)||0;
  if(km > Number(s.baseKm)){
    const extra = km - Number(s.baseKm);
    const blocks = Math.ceil(extra / (Number(s.extraKmBlock)||3));
    price += blocks * (Number(s.extraKmRate)||0);
  }
  if(catCount > Number(s.baseCats)){
    price += (catCount - Number(s.baseCats)) * (Number(s.extraCatRate)||0);
  }
  return price;
}

function monthlyFinancials(basis){
  const map = {};
  function ensure(m){ if(!map[m]) map[m]={income:0, expense:0}; return map[m]; }
  if(basis==='cash'){
    DB.invoices.forEach(inv=>{
      (inv.payments||[]).forEach(p=>{
        const m=(p.date||'').slice(0,7); if(!m) return;
        ensure(m).income += Number(p.amount)||0;
      });
    });
  } else {
    DB.invoices.forEach(inv=>{
      (inv.visits||[]).forEach(v=>{
        const m=(v.date||'').slice(0,7); if(!m) return;
        ensure(m).income += Number(v.price)||0;
      });
      if(inv.cctv && inv.cctv.needed){
        const dayRate = Number(inv.cctv.rate)||0;
        const numDays = Number(inv.cctv.days)||0;
        if(numDays>0 && inv.startDate){
          let d = new Date(inv.startDate+'T00:00:00');
          for(let i=0;i<numDays;i++){
            const m = d.toISOString().slice(0,7);
            ensure(m).income += dayRate;
            d.setDate(d.getDate()+1);
          }
        }
      }
    });
  }
  DB.expenses.forEach(e=>{
    const m=(e.date||'').slice(0,7); if(!m) return;
    ensure(m).expense += Number(e.amount)||0;
  });
  return map;
}

function getMonthBookedDates(year, month){
  const set = new Set();
  DB.invoices.forEach(inv=> (inv.visits||[]).forEach(v=>{
    if(!v.date) return;
    const d = new Date(v.date+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===month) set.add(v.date);
  }));
  return set;
}
function getMonthVisitCounts(year, month){
  const counts = {};
  DB.invoices.forEach(inv=> (inv.visits||[]).forEach(v=>{
    if(!v.date) return;
    const d = new Date(v.date+'T00:00:00');
    if(d.getFullYear()===year && d.getMonth()===month) counts[v.date] = (counts[v.date]||0) + 1;
  }));
  return counts;

function dayCapacity(dateStr, holidayMap){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay();
  const isWeekendOrHoliday = dow===0 || dow===6 || !!holidayMap[dateStr];
  return isWeekendOrHoliday ? 8 : 3;
}
function dayStatus(dateStr, count, holidayMap){
  if(!count) return 'open';
  return count >= dayCapacity(dateStr, holidayMap) ? 'full' : 'limited';
}

  const prefix = `${year}-${String(month+1).padStart(2,'0')}`;

function getUpcomingCatDates(daysAhead){
  const today = new Date(); today.setHours(0,0,0,0);
  const results = [];
  DB.clients.forEach(c=>{
    (c.pets||[]).forEach(p=>{
      if(!p.birthday) return;
      const bd = new Date(p.birthday+'T00:00:00');
      let next = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
      if(next < today) next = new Date(today.getFullYear()+1, bd.getMonth(), bd.getDate());
      const diffDays = Math.round((next - today) / (1000*60*60*24));
      if(diffDays <= daysAhead){
        const years = next.getFullYear() - bd.getFullYear();
        results.push({pet:p, client:c, nextDate:next, diffDays, years});
      }
    });
  });
  results.sort((a,b)=> a.diffDays - b.diffDays);
  return results;
}

function clientStats(c){
  const invs = DB.invoices.filter(i=>i.clientId===c.id);
  const revenue = invs.reduce((s,i)=> s + (i.payments||[]).reduce((s2,p)=>s2+Number(p.amount),0), 0);
  const serviceCount = invs.reduce((s,i)=>s+((i.visits||[]).length),0);
  const exps = DB.expenses.filter(e=>e.clientId===c.id);
  const hasParking = exps.some(e=>e.category==='停车');
  const hasHighway = exps.some(e=>e.category==='过路费');
  const hasPlatform = exps.some(e=>e.category==='平台费');
  const reimbursable = exps.filter(e=>e.reimbursable).reduce((s,e)=>s+Number(e.amount),0);
  const notReimbursable = exps.filter(e=>!e.reimbursable).reduce((s,e)=>s+Number(e.amount),0);
  return {revenue, serviceCount, hasParking, hasHighway, hasPlatform, reimbursable, notReimbursable, invCount:invs.length};
}

/* ---- shared invoice/quote model ---- */
function totalServiceCount_(){ return DB.invoices.reduce((s,inv)=> s+(inv.visits||[]).length, 0); }
function docSubtotal(doc){
  const visitsTotal = (doc.visits||[]).reduce((s,v)=>s+(Number(v.price)||0),0);
  const cctvTotal = (doc.cctv && doc.cctv.needed) ? (Number(doc.cctv.days)||0)*(Number(doc.cctv.rate)||0) : 0;
  const holidayTotal = (doc.holidayFee && doc.holidayFee.needed) ? (Number(doc.holidayFee.amount)||0) : 0;
  return visitsTotal + cctvTotal + holidayTotal;
}
function discountAmt(doc){
  if(!doc.discount || !doc.discount.needed) return 0;
  const sub = docSubtotal(doc);
  const raw = doc.discount.type==='percent' ? sub*(Number(doc.discount.amount)||0)/100 : (Number(doc.discount.amount)||0);
  return Math.max(0, Math.min(raw, sub));
}
function docTotal(doc){
  return docSubtotal(doc) - discountAmt(doc);
}
function depositAmt(doc){ return docTotal(doc) * (Number(doc.depositPercent)||50) / 100; }
function invStatus(inv){
  const paid = (inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
  const total = docTotal(inv);
  if(paid >= total - 0.001 && total>0) return {label:'已付清', cls:'green'};
  if(inv.endDate && inv.endDate < todayStr() && paid < total) return {label:'已逾期', cls:'red'};
  if(paid>0) return {label:'部分付款', cls:'orange'};
  return {label:'待付款', cls:'gray'};
}
function renderDocList(type){
  let list = type==='invoice'? DB.invoices : DB.quotes;
  const q = (window.__docQuery||'').toLowerCase();
  if(q){
    list = list.filter(d=>{
      const c = DB.clients.find(x=>x.id===d.clientId);
      const name = (c?c.name:(d.leadName||'')).toLowerCase();
      return name.includes(q) || (d.no||'').toLowerCase().includes(q);
    });
  }
  const searchBox = `<div class="searchbar ${window.__docQuery?'has-value':''}" style="margin-bottom:12px;">
    <span class="sic">🔍</span>
    <input id="docSearchInput" placeholder="搜索客户姓名或单号 Search by client name or no." value="${window.__docQuery||''}" oninput="window.__docQuery=this.value; render();">
    <button class="clr" onclick="window.__docQuery=''; render();">✕</button>
  </div>`;
  if(type==='invoice'){
    const filter = window.__invFilter || 'all';
    if(filter!=='all'){
      list = list.filter(i=>{
        const st = invStatus(i);
        if(filter==='paid') return st.label==='已付清';
        if(filter==='partial') return st.label==='部分付款';
        if(filter==='unpaid') return st.label==='待付款';
        if(filter==='overdue') return st.label==='已逾期';
        return true;
      });
    }
    const filterChips = [['all','全部 All'],['unpaid','待付款'],['partial','部分付款'],['overdue','已逾期'],['paid','已付清']];
    const filterBar = `<div class="row" style="gap:6px; margin-bottom:12px; overflow-x:auto; flex-wrap:nowrap;">
      ${filterChips.map(([k,l])=>`<div class="subchip ${filter===k?'active':''}" style="flex:none; white-space:nowrap;" onclick="window.__invFilter='${k}'; render();">${l}</div>`).join('')}
    </div>`;

function docCalendarHTML(){
  const m = window.__docCalMonth || new Date();
  const year = m.getFullYear(), month = m.getMonth();
  const selectedDates = new Set((window.__visits||[]).map(v=>v.date));
  const first = new Date(year,month,1); const startDow = first.getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const cells = []; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1; d<=daysInMonth; d++) cells.push(d);
  const dowLabels = ['日','一','二','三','四','五','六'];
  const todayS = todayStr();
  const grid = cells.map(d=>{
    if(!d) return `<div class="cal-cell empty"></div>`;
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cal-cell']; if(selectedDates.has(ds)) cls.push('selected'); if(ds===todayS) cls.push('today');
    return `<div class="${cls.join(' ')}" onclick="toggleDocCalDate('${ds}')">${d}</div>`;
  }).join('');
  const count = new Set((window.__visits||[]).map(v=>v.date)).size;
  return `
  <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:10px;">
    <button class="btn btn-soft btn-sm" onclick="shiftDocCalMonth(-1)">‹</button>
    <div style="font-weight:800;">${year}年${month+1}月</div>
    <button class="btn btn-soft btn-sm" onclick="shiftDocCalMonth(1)">›</button>
  </div>
  <div class="cal-grid">
    ${dowLabels.map(l=>`<div class="cal-dow">${l}</div>`).join('')}
    ${grid}
  </div>
  <div class="muted" style="margin-top:8px; text-align:center; font-weight:700;">已选 ${count} 天 Selected</div>
  `;
}

  window.__docCalMonth = new Date(m.getFullYear(), m.getMonth()+delta, 1);

}

function addVisitsForDate(ds){

  if(twice){
    window.__visits.push({id:uid(), date:ds, timeSlot:'第1次 1st', tasks: defaultTaskSelection(), extraNotes:'', price:0});

function fillDocDateRange(){
  const start = val('f_doc_rangestart'), end = val('f_doc_rangeend');
  if(!start || !end){ toast('请先选择区间的起止日期'); return; }
  if(end < start){ toast('结束日期不能早于起始日期'); return; }
  if(!window.__visits) window.__visits = [];
  const existing = new Set(window.__visits.map(v=>v.date));
  let added = 0;
  let d = new Date(start+'T00:00:00'); const endD = new Date(end+'T00:00:00');
  while(d <= endD){
    const ds = d.toISOString().slice(0,10);
    if(!existing.has(ds)){
      addVisitsForDate(ds);
      existing.add(ds); added++;
    }
    d.setDate(d.getDate()+1);
  }
  window.__visits.sort((a,b)=> a.date<b.date?-1:1);
  window.__docCalMonth = new Date(new Date(start+'T00:00:00').getFullYear(), new Date(start+'T00:00:00').getMonth(), 1);
  updateDocDateRangeFromVisits();
  document.getElementById('docCalWrap').innerHTML = docCalendarHTML();
  renderVisitRows();
  toast(`已添加 ${added} 天 Added ${added} days`);
}
function toggleDocCalDate(ds){
  if(!window.__visits) window.__visits=[];
  const hasDate = window.__visits.some(v=>v.date===ds);
  if(hasDate){ window.__visits = window.__visits.filter(v=>v.date!==ds); }
  else {
    addVisitsForDate(ds);
    window.__visits.sort((a,b)=> a.date<b.date?-1:1);
  }
  updateDocDateRangeFromVisits();
  document.getElementById('docCalWrap').innerHTML = docCalendarHTML();
  renderVisitRows();
}
function updateDocDateRangeFromVisits(){
  const dates = (window.__visits||[]).map(v=>v.date).filter(Boolean).sort();
  const startEl = document.getElementById('f_doc_start'), endEl = document.getElementById('f_doc_end');
  if(dates.length){ if(startEl) startEl.value = dates[0]; if(endEl) endEl.value = dates[dates.length-1]; }
  const cctvDaysInput = document.getElementById('f_doc_cctv_days');
  if(cctvDaysInput) cctvDaysInput.value = dates.length? daysBetweenInclusive(dates[0], dates[dates.length-1]) : 0;
}
function regenerateVisits(){
  const start = val('f_doc_start'), end = val('f_doc_end');
  if(!start||!end||end<start){ toast('请先正确选择起止日期'); return; }
  const freqVal = val('f_doc_freq');
  const interval = freqVal==='twice' ? 1 : (Number(freqVal)||1);
  const perDay = freqVal==='twice' ? 2 : 1;
  const timeSlot = val('f_doc_timeslot');
  const dates=[]; let d=new Date(start+'T00:00:00'); const endD=new Date(end+'T00:00:00');
  while(d<=endD){ dates.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+interval); }
  window.__visits = [];
  dates.forEach(ds=>{
    for(let n=0; n<perDay; n++){
      window.__visits.push({id:uid(), date:ds, timeSlot: perDay>1? (timeSlot+(n===0?' (第1次 / 1st)':' (第2次 / 2nd)')) : timeSlot, tasks: defaultTaskSelection(), extraNotes:'', price:0});
    }
  });
  const cctvDaysInput = document.getElementById('f_doc_cctv_days');
  if(cctvDaysInput) cctvDaysInput.value = daysBetweenInclusive(start,end);
  renderVisitRows();
  toast(`已生成 ${window.__visits.length} 条行程`);
}

function pawPadSVG(cx, cy, s, filled, color){
  const padRx=5*s, padRy=6*s, padCy=cy+3*s;
  const toeRx=2.3*s, toeRy=3*s;
  const toes = [[-5*s,-4*s],[-2*s,-7*s],[2*s,-7*s],[5*s,-4*s]];
  const toeEls = toes.map(t=>`<ellipse cx="${(cx+t[0]).toFixed(1)}" cy="${(cy+t[1]).toFixed(1)}" rx="${toeRx.toFixed(1)}" ry="${toeRy.toFixed(1)}"/>`).join('');
  const style = filled? `fill="${color}" stroke="none"` : `fill="none" stroke="${color}" stroke-width="1.6" stroke-dasharray="2.2,2.2"`;
  return `<g ${style}>
    <ellipse cx="${cx.toFixed(1)}" cy="${padCy.toFixed(1)}" rx="${padRx.toFixed(1)}" ry="${padRy.toFixed(1)}"/>
    ${toeEls}
  </g>`;
}
function renderMilestonePath(orderCount){
  let curIdx = -1;
  for(let i=0;i<MILESTONE_LIST.length;i++){ if(orderCount>=MILESTONE_LIST[i]) curIdx=i; else break; }
  const startIdx = Math.max(0, curIdx-1);
  const endIdx = Math.min(MILESTONE_LIST.length-1, startIdx+4);
  const shown = MILESTONE_LIST.slice(startIdx, endIdx+1);
  const n = shown.length;
  const w = 600, h = 120, padX = 40, padY = 34;
  const stepX = n>1? (w-padX*2)/(n-1) : 0;
  const stepY = n>1? (h-padY)/(n-1) : 0;
  const points = shown.map((m,i)=>({
    m, idx: startIdx+i,
    x: padX + i*stepX,
    y: (h-padY/2) - i*stepY,
    unlocked: m<=orderCount
  }));
  const pawTrail = points.slice(0, -1).map((p,i)=>{
    const a = p, b = points[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.sqrt(dx*dx+dy*dy)||1;
    const px = -dy/len, py = dx/len;
    const angle = Math.atan2(dy,dx) * 180/Math.PI + 90;
    const segUnlocked = a.unlocked;
    const color = segUnlocked? '#F3A57E' : '#DDD3C2';
    const opacity = segUnlocked? 0.9 : 0.5;
    const pawCount = 4;
    const paws = [];
    for(let k=1;k<pawCount;k++){
      const t = k/pawCount;
      const x = a.x + dx*t, y = a.y + dy*t;
      const side = (k%2===0)? 7 : -7;
      const ox = x + px*side, oy = y + py*side;
      paws.push(`<g transform="rotate(${angle.toFixed(1)} ${ox.toFixed(1)} ${oy.toFixed(1)})" opacity="${opacity}">${pawPadSVG(ox, oy, 0.6, true, color)}</g>`);
    }
    return paws.join('');
  }).join('');
  let markerX = points[0].x, markerY = points[0].y;
  const curPos = points.findIndex(p=>p.idx===curIdx);
  if(curPos>=0 && curPos<points.length-1){
    const a=points[curPos], b=points[curPos+1];
    const t = Math.min(1, Math.max(0, (orderCount-a.m)/(b.m-a.m)));
    markerX = a.x + (b.x-a.x)*t; markerY = a.y + (b.y-a.y)*t;
  } else if(curPos===-1){
    const b = points[0];
    const t = Math.min(1, Math.max(0, orderCount/b.m));
    const originX = b.x - stepX, originY = b.y + stepY;
    markerX = originX + (b.x-originX)*t; markerY = originY + (b.y-originY)*t;
  } else if(curPos===points.length-1){
    markerX = points[curPos].x; markerY = points[curPos].y;
  }
  const flags = points.map(p=>{
    const color = p.unlocked? '#6C8B72':'#C9BDA3';
    const bg = p.unlocked? '#E9F1EA':'#F4ECDF';
    return `<g>
      <circle cx="${p.x}" cy="${p.y}" r="18" fill="${bg}" stroke="${color}" stroke-width="2.5"/>
      ${pawPadSVG(p.x, p.y+2, p.unlocked?1.15:1, p.unlocked, p.unlocked?'#E68A57':'#C9BDA3')}
      <text x="${p.x}" y="${p.y+34}" text-anchor="middle" font-size="12" font-weight="800" fill="${color}">${p.m}</text>
    </g>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%; height:110px; display:block;">
    ${pawTrail}
    ${flags}
    <circle cx="${markerX.toFixed(1)}" cy="${markerY.toFixed(1)}" r="6" fill="#D97066"/>
  </svg>`;
}
function checkMilestone(){
  const count = totalServiceCount_();
  const shown = DB.settings.milestonesShown || [];
  if(!shown.length && count > MILESTONE_LIST[0]){
    // Existing historical data (not a brand-new business) — silently mark milestones
    // already passed instead of celebrating them all at once retroactively.
    DB.settings.milestonesShown = MILESTONE_LIST.filter(m=> m<=count);
    save('settings');
    return;
  }
  const next = MILESTONE_LIST.find(m=> count>=m && !shown.includes(m));
  if(next){
    DB.settings.milestonesShown = [...shown, next];
    save('settings');
    showMilestoneCelebration(next, count);
  }
}

function deleteDoc(type,id){
  confirmAction('确定删除吗？Delete this?', ()=>{
    if(type==='invoice'){
      const inv = DB.invoices.find(x=>x.id===id);
      DB.invoices = DB.invoices.filter(x=>x.id!==id);
      if(inv){
        const m = /^INV-(\d{4})-(\d+)$/.exec(inv.no||'');
        if(m && Number(m[1])===new Date().getFullYear() && Number(m[2])===DB.settings.invoiceSeq-1){
          DB.settings.invoiceSeq--; save('settings');
        }
      }
      save('invoices'); state.invId=null;
    }
    else {
      const q = DB.quotes.find(x=>x.id===id);
      DB.quotes = DB.quotes.filter(x=>x.id!==id);
      if(q){
        const m = /^Q-(\d{4})-(\d+)$/.exec(q.no||'');
        if(m && Number(m[1])===new Date().getFullYear() && Number(m[2])===DB.settings.quoteSeq-1){
          DB.settings.quoteSeq--; save('settings');
        }
      }
      save('quotes'); state.quoteId=null;
    }
    render(); toast('已删除');
  });
}

function copyQuoteText(id){
  const doc = DB.quotes.find(x=>x.id===id); if(!doc) return;
  const c = DB.clients.find(x=>x.id===doc.clientId);
  const isEN = state.lang === 'en';
  const total = docTotal(doc);
  const dep = depositAmt(doc);
  const totalDays = (doc.visits||[]).length;
  const perVisit = (doc.visits&&doc.visits[0])? doc.visits[0].price : 0;
  const included = (DB.settings.taskOptions||[]).filter(t=>{
    const low = t.toLowerCase();
    return !low.includes('medication') && !low.includes('喂药') && !low.includes('grooming') && !low.includes('梳毛');
  });
  const lines = [];
  lines.push(isEN? `${DB.settings.businessName} Quotation` : `${DB.settings.businessName} 报价单 Quotation`);
  lines.push(`${doc.no}`);
  lines.push('');
  lines.push(`${isEN?'Client':'客户 Client'}: ${c?c.name:(doc.leadName||'—')}`);
  lines.push(`${isEN?'Dates':'服务日期 Dates'}: ${doc.startDate||'—'} ~ ${doc.endDate||'—'} (${totalDays} ${isEN?'days':'天/days'})`);
  if(km) lines.push(`${isEN?'Distance':'距离 Distance'}: ${km}km`);
  lines.push('');
  lines.push(isEN? "What's Included:" : '服务包含 Included:');
  included.forEach(t=> lines.push(`✓ ${isEN? enOnly(t) : t}`));
  lines.push(isEN? '(Customizable services available)' : '（可定制服务 Customizable services available）');
  lines.push('');
  lines.push(isEN? 'How pricing is calculated:' : '收费计算方式 How pricing is calculated:');
  if(isEN){
    lines.push(`Within ${DB.settings.baseKm}km round-trip, base fee is ${fmt(DB.settings.baseRate)} (up to ${DB.settings.baseCats} cats included).`);
    lines.push(`Beyond ${DB.settings.baseKm}km, +${fmt(DB.settings.extraKmRate)} for every extra ${DB.settings.extraKmBlock}km.`);
    lines.push(`More than ${DB.settings.baseCats} cats: +${fmt(DB.settings.extraCatRate)} per additional cat.`);
  } else {
    lines.push(`往返 ${DB.settings.baseKm}km 内，基本服务费是 ${fmt(DB.settings.baseRate)}（含最多 ${DB.settings.baseCats} 只猫）。`);
    lines.push(`超过 ${DB.settings.baseKm}km，每多 ${DB.settings.extraKmBlock}km 加收 ${fmt(DB.settings.extraKmRate)}。`);
    lines.push(`猫咪超过 ${DB.settings.baseCats} 只，每多一只加收 ${fmt(DB.settings.extraCatRate)}。`);
  }
  lines.push('');
  lines.push(`${isEN?'Per Visit':'单次价格 Per Visit'}: ${fmt(perVisit)}`);
  if(doc.cctv&&doc.cctv.needed) lines.push(`${isEN?'CCTV Rental':'CCTV 租用 Rental'}: ${fmt((Number(doc.cctv.days)||0)*(Number(doc.cctv.rate)||0))}`);
  if(doc.holidayFee&&doc.holidayFee.needed) lines.push(`${isEN?'Holiday Fee':'节日费 Holiday Fee'}: ${fmt(Number(doc.holidayFee.amount)||0)}`);
  if(doc.notes) { lines.push(''); lines.push(`${isEN?'Notes':'备注 Notes'}: ${doc.notes}`); }
  const text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=> toast('已复制，可以直接贴到WhatsApp了 📋')).catch(()=> fallbackCopy(text));
  } else { fallbackCopy(text); }
}
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand('copy'); toast('已复制 📋'); }
  catch(e){ toast('复制失败，请手动选取文字'); }
  document.body.removeChild(ta);
}
function duplicateDoc(type, id){
  const list = type==='invoice'? DB.invoices : DB.quotes;
  const src = list.find(x=>x.id===id);
  if(!src) return;
  const clone = JSON.parse(JSON.stringify(src));
  clone.id = uid();
  clone.visits = (clone.visits||[]).map(v=>({...v, id:uid()}));
  clone.payments = [];
  if(type==='invoice'){
    clone.no = 'INV-'+new Date().getFullYear()+'-'+String(DB.settings.invoiceSeq++).padStart(3,'0');
    DB.invoices.push(clone);
    save('invoices'); save('settings');
    state.moneyTab='invoices'; state.invId=clone.id;
  } else {
    clone.no = 'Q-'+new Date().getFullYear()+'-'+String(DB.settings.quoteSeq++).padStart(3,'0');
    clone.status = 'draft';
    DB.quotes.push(clone);
    save('quotes'); save('settings');
    state.moneyTab='quotes'; state.quoteId=clone.id;
  }
  render();
  toast('已复制，改好日期/价格再保存 Duplicated — adjust dates/prices then save');
  openDocForm(type, clone.id);
}

function savePayment(invId){
  const btn = document.getElementById('btn_save_payment');
  if(btn && btn.disabled) return;
  if(btn) btn.disabled = true;
  const amt = Number(val('f_pay_amt'));
  if(!amt || amt<=0){ toast('请输入有效金额'); if(btn) btn.disabled=false; return; }
  const inv = DB.invoices.find(x=>x.id===invId);
  const total = docTotal(inv);
  const paidSoFar = (inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
  const remaining = Math.max(total-paidSoFar, 0);
  if(amt > remaining + 0.01){ toast(`超过剩余应付金额 ${fmt(remaining)}，请重新输入`); if(btn) btn.disabled=false; return; }
  if(!inv.payments) inv.payments=[];
  inv.payments.push({amount:amt, date:val('f_pay_date'), method:val('f_pay_method'), note:val('f_pay_note').trim()});
  save('invoices'); closeModal(); render(); toast('付款已记录 💰');
}

    if(!inv || !inv.payments) return;
    inv.payments.splice(idx,1);

function savePaymentEdit(invId, idx){
  const amt = Number(val('f_payedit_amt'));
  if(!amt || amt<=0){ toast('请输入有效金额'); return; }
  const inv = DB.invoices.find(x=>x.id===invId);
  const p = inv.payments[idx];
  if(!p) return;
  const otherPaid = inv.payments.reduce((s,pp,i)=> i===idx? s : s+Number(pp.amount), 0);
  const total = docTotal(inv);
  if(otherPaid + amt > total + 0.01){ toast(`超过账单总额，剩余可填 ${fmt(Math.max(total-otherPaid,0))}`); return; }
  p.amount = amt; p.date = val('f_payedit_date'); p.method = val('f_payedit_method'); p.note = val('f_payedit_note').trim();
  save('invoices'); closeModal(); render(); toast('付款记录已更新 Payment updated');
}

  `;
  document.body.appendChild(wrap);

  const imgs = Array.from(wrap.querySelectorAll('img'));
  const waitForImages = Promise.all(imgs.map(img=> img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=res; img.onerror=res; })));

  waitForImages.then(()=> html2canvas(wrap, {scale:1.5, backgroundColor:'#ffffff', useCORS:true})).then(canvas=>{
    const wrapRect = wrap.getBoundingClientRect();
    const wrapWidthPx = wrap.offsetWidth;
    const rowBoundariesPx = Array.from(wrap.querySelectorAll('table tr')).map(tr=> tr.getBoundingClientRect().bottom - wrapRect.top);
    document.body.removeChild(wrap);
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = pdf.internal.pageSize.getWidth(); const pageH = pdf.internal.pageSize.getHeight();
    const imgH = canvas.height * pageW / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    if(imgH <= pageH){
      pdf.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
    } else {
      // Compute safe page-break points (in mm) that avoid slicing through a table row.
      const mmPerPx = pageW / wrapWidthPx;
      const rowBoundariesMM = rowBoundariesPx.map(px=>px*mmPerPx).filter(v=> v>0 && v<imgH);
      const tolerance = pageH*0.3;
      const breaksMM = [];
      let naive = pageH, prevBreak = 0;
      while(naive < imgH){
        let best = naive;
        rowBoundariesMM.forEach(rb=>{ if(rb>prevBreak && rb<=naive && (naive-rb)<=tolerance) best = rb; });
        breaksMM.push(best);
        prevBreak = best;
        naive = best + pageH;
      }
      breaksMM.push(imgH);
      // Crop the canvas into exact, non-overlapping slices for each page (avoids the
      // duplication that happens if you rely on jsPDF's page boundary to clip content,
      // since our safe breaks are often earlier than a full page height).
      const pxPerMM = canvas.width / pageW;
      let prevPx = 0;
      breaksMM.forEach((bMM, i)=>{
        const bPx = Math.round(bMM * pxPerMM);
        const sliceHeightPx = bPx - prevPx;
        if(sliceHeightPx <= 0) return;
        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width; pageCanvas.height = sliceHeightPx;
        pageCanvas.getContext('2d').drawImage(canvas, 0, prevPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
        const sliceData = pageCanvas.toDataURL('image/jpeg', 0.92);
        const sliceHeightMM = sliceHeightPx / pxPerMM;
        if(i>0) pdf.addPage();
        pdf.addImage(sliceData, 'JPEG', 0, 0, pageW, sliceHeightMM);
        prevPx = bPx;
      });
    }
    if(mode==='inline'){
      openModal(`
        <div class="modalhead"><h2>PDF 预览 Preview</h2><button class="closex" onclick="closeModal()">✕</button></div>
        <div class="muted" style="margin-bottom:10px; font-size:12.5px; line-height:1.6;">这是账单内容预览，用来核对内容对不对。Claude对话框里有下载限制，没办法真的存成文件——如果要保存/发给客户，请把这个App托管到网页后用手机/电脑浏览器打开再下载或截图。<br>This is a content preview to check everything looks right. Claude's chat sandbox blocks real downloads — to actually save or send this, open the hosted version of this app in a real browser.</div>
        <img src="${imgData}" style="width:100%; border-radius:8px; border:1px solid #EDE2D0;">
      `);
      toast('PDF 内容预览 📄');
      return;
    }
    if(mode==='view'){
      const blobUrl = pdf.output('bloburl');
      if(preOpenedWindow && !preOpenedWindow.closed){ preOpenedWindow.location.href = blobUrl; }
      else { window.open(blobUrl, '_blank'); }
      toast('PDF 已在新页面打开 📄');
      return;
    }
    const fileName = `${doc.no}.pdf`;
    const pdfBlob = pdf.output('blob');
    const pdfFile = new File([pdfBlob], fileName, {type:'application/pdf'});
    window.__preparedShare = { file: pdfFile, fileName };
    openModal(`
      <div class="modalhead"><h2>PDF 已生成 Ready</h2><button class="closex" onclick="closeModal()">✕</button></div>
      <img src="${imgData}" style="width:100%; border-radius:8px; border:1px solid #EDE2D0; margin-bottom:14px;">
      <button class="btn btn-primary btn-block" onclick="shareFile()">📤 分享 Share</button>
    `);
    toast('PDF 已生成 📄');
  }).catch((err)=>{
    if(document.body.contains(wrap)) document.body.removeChild(wrap);
    if(preOpenedWindow && !preOpenedWindow.closed){ try{ preOpenedWindow.close(); }catch(e){} }
    console.error('PDF generation failed:', err);
    toast('生成失败：'+(err&&err.message? err.message.slice(0,60) : '请重试'));
  });
}
async function shareFile(){
  const p = window.__preparedShare; if(!p) return;
  try{
    if(navigator.canShare && navigator.canShare({files:[p.file]})){
      await navigator.share({files:[p.file]});
      toast('已分享 📄');
      closeModal();
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return; // user cancelled the share sheet
    console.error('navigator.share failed:', e);
  }
  // This browser doesn't support sharing a file directly — open it so the user can
  // save it themselves via the viewer's own share icon.
  const blobUrl = URL.createObjectURL(p.file);
  window.open(blobUrl, '_blank');
  toast('这个浏览器不支持直接分享文件：新页面打开后，点右上角分享图标 → 存储到文件，再从文件App分享 📄');
  closeModal();
}

  Object.assign(DB.settings, {
    businessName: val('f_biz_name').trim() || 'Wisley Meowcare',
    businessAddress: val('f_biz_address').trim(),
    baseRate:Number(val('f_s_baseRate'))||0, baseKm:Number(val('f_s_baseKm'))||0,
    extraKmBlock:Number(val('f_s_extraKmBlock'))||1, extraKmRate:Number(val('f_s_extraKmRate'))||0,
    baseCats:Number(val('f_s_baseCats'))||0, extraCatRate:Number(val('f_s_extraCatRate'))||0,
    cctvDailyRate:Number(val('f_s_cctvRate'))||0, depositPercent:Number(val('f_s_deposit'))||50,
    serviceNotes: val('f_s_notes'), terms: val('f_s_terms'),
  });
  save('settings');
  document.getElementById('brandName').textContent = DB.settings.businessName;
  closeModal(); toast('设置已保存');
}

/* ---------------- init ---------------- */
function startApp(){
  loadAll().then(()=>{
    document.getElementById('brandName').textContent = DB.settings.businessName;
    document.getElementById('logoImg').src = LOGO_B64;
    const ll = document.getElementById('loginLogo'); if(ll) ll.src = LOGO_B64;
    state.lang = DB.settings.lang || 'zh';
    const langBtn = document.getElementById('langBtn'); if(langBtn) langBtn.textContent = state.lang==='zh'?'EN':'中';
    document.getElementById('loadingScreen').style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('shell').style.display='';
    render();
  });
}
function showLogin(){
  const ll = document.getElementById('loginLogo'); if(ll) ll.src = LOGO_B64;
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('shell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
function doLogin(){
  const email = val('f_login_email').trim();
  const pass = val('f_login_pass');
  const errEl = document.getElementById('loginError');
  errEl.textContent='';
  if(!email || !pass){ errEl.textContent='请输入邮箱和密码 Enter email and password'; return; }
  fbAuth.signInWithEmailAndPassword(email, pass).catch(err=>{
    errEl.textContent = '登录失败 Login failed: '+(err&&err.message? err.message : '');
  });
}
function doLogout(){ if(fbAuth){ closeModal(); fbAuth.signOut(); } }
function exportToExcel(){
  if(typeof XLSX === 'undefined'){ toast('Excel导出组件加载失败，请检查网络 Excel export library failed to load'); return; }
  try{
    const wb = XLSX.utils.book_new();

    const clientRows = DB.clients.map(c=>{
      const st = clientStats(c);
      return {
        '客户ID': c.id, '姓名 Name': c.name, '电话 Phone': c.phone||'', '地址 Address': c.address||'',
        '往返里程(km)': c.km||0, '猫咪 Pets': (c.pets||[]).map(p=>p.name).join('、'),
        '服务次数 Services': st.serviceCount, '累计收入 Revenue': st.revenue,
        '社交媒体授权 Social Consent': c.socialConsent==='yes'?'可以':(c.socialConsent==='no'?'不可以':'未确认'),
        '已发布 Posted': c.socialPosted? '是':'否',
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientRows), 'Clients 客户');

    const invRows = DB.invoices.map(inv=>{
      const c = DB.clients.find(x=>x.id===inv.clientId);
      const total = docTotal(inv); const paid=(inv.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
      return {
        '账单号 No': inv.no, '客户 Client': c?c.name:(inv.leadName||''), '开始日期 Start': inv.startDate, '结束日期 End': inv.endDate,
        '总额 Total': total, '已付 Paid': paid, '剩余 Remaining': Math.max(total-paid,0), '备注 Notes': inv.notes||'',
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), 'Invoices 账单');

    const visitRows = [];
    DB.invoices.forEach(inv=>{
      const c = DB.clients.find(x=>x.id===inv.clientId);
      (inv.visits||[]).forEach(v=>{
        visitRows.push({ '账单号 No': inv.no, '客户 Client': c?c.name:(inv.leadName||''), '日期 Date': v.date, '时间段 Time Slot': v.timeSlot||'', '价格 Price': v.price||0 });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(visitRows), 'Services 服务记录');

    const payRows = [];
    DB.invoices.forEach(inv=>{
      const c = DB.clients.find(x=>x.id===inv.clientId);
      (inv.payments||[]).forEach(p=>{
        payRows.push({ '账单号 No': inv.no, '客户 Client': c?c.name:(inv.leadName||''), '日期 Date': p.date, '金额 Amount': p.amount, '方式 Method': p.method||'', '备注 Note': p.note||'' });
      });
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(payRows), 'Payments 付款记录');

    const expRows = DB.expenses.map(e=>{
      const c = DB.clients.find(x=>x.id===e.clientId);
      return { '日期 Date': e.date, '类别 Category': e.category, '金额 Amount': e.amount, '关联客户 Client': c?c.name:'', '可报销 Reimbursable': e.reimbursable?'是':'否', '备注 Note': e.note||'' };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expRows), 'Expenses 开销');

    XLSX.writeFile(wb, `wisley-meowcare-${todayStr()}.xlsx`);
    toast('Excel已导出 📊');
  }catch(err){
    console.error('Excel export failed:', err);
    toast('导出失败 Export failed: '+(err&&err.message?err.message.slice(0,60):''));
  }
}
function openImportUI(){
  openModal(`
  <div class="modalhead"><h2>导入数据 Import Data</h2><button class="closex" onclick="closeModal()">✕</button></div>
  <div class="muted" style="margin-bottom:10px; font-size:12.5px; line-height:1.6;">把整理好的JSON数据粘贴到下面，点导入。<br>Paste the prepared JSON below and tap Import.</div>
  <div class="checkline" style="margin-bottom:10px;"><input type="checkbox" id="f_import_overwrite"> 如果ID已存在，覆盖更新（而不是跳过）<br><span class="muted" style="font-size:11.5px;">If ID already exists, overwrite it instead of skipping — use this when re-importing corrected data</span></div>
  <textarea id="f_import_json" style="min-height:180px; font-family:monospace; font-size:11.5px;" placeholder='{"clients":[...],"invoices":[...]}'></textarea>
  <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="runImport()">导入 Import</button>
  `);
}
function runImport(){
  let data;
  try{ data = JSON.parse(val('f_import_json')); }
  catch(e){ toast('JSON格式不对，请检查 Invalid JSON'); return; }
  const overwrite = document.getElementById('f_import_overwrite').checked;
  let addedClients=0, addedInvoices=0, addedExpenses=0, updated=0, skipped=0;
  (data.clients||[]).forEach(c=>{
    if(!c.id) c.id = uid();
    const existing = DB.clients.find(x=>x.id===c.id);
    if(existing){
      if(overwrite){ Object.assign(existing, c); updated++; } else { skipped++; }
      return;
    }
    DB.clients.push(c); addedClients++;
  });
  (data.invoices||[]).forEach(inv=>{
    if(!inv.id) inv.id = uid();
    if(!inv.payments) inv.payments=[];
    const idx = DB.invoices.findIndex(x=>x.id===inv.id);
    if(idx>-1){
      if(overwrite){ DB.invoices[idx] = inv; updated++; } else { skipped++; }
      return;
    }
    DB.invoices.push(inv); addedInvoices++;
  });
  (data.expenses||[]).forEach(e=>{
    if(!e.id) e.id = uid();
    const existing = DB.expenses.find(x=>x.id===e.id);
    if(existing){
      if(overwrite){ Object.assign(existing, e); updated++; } else { skipped++; }
      return;
    }
    DB.expenses.push(e); addedExpenses++;
  });
  save('clients'); save('invoices'); save('expenses');
  closeModal(); render();
  toast(`已导入 ${addedClients} 位客户、${addedInvoices} 张账单、${addedExpenses} 条开销${updated? `，${updated}条已覆盖更新`:''}${skipped? `（${skipped}条已存在，跳过）`:''} 🎉`);
}

if(USE_FIREBASE && fbAuth){
  fbAuth.onAuthStateChanged(user=>{
    fbUser = user;
    if(user) startApp(); else showLogin();
  });
} else {
  startApp();
}
</script>
